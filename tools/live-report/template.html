<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analyse des lives — LFP Crypto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte Cryptos Exponentielles (decouvrir.cryptos-exponentielles.com) */
  --paper:#f7f8fa; --surface:#ffffff; --ink:#011c40; --muted:#5b6b82; --line:#e3e8ef;
  --accent:#056cf2; --accent-bg:#eaf2fe;
  --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Kollektif,Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:500;font-size:14px;margin:0 0 10px}
.brand img{height:34px;width:auto;display:block}
.brand .logo-txt{color:var(--ink);font-weight:800;font-size:20px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
.period{color:var(--muted);font-size:14px;margin-top:4px}

.tabs-nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:18px;overflow-x:auto}
.tab-btn{flex:1;min-width:90px;padding:10px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit}
.tab-btn:hover{background:var(--paper);color:var(--ink)}
.tab-btn.active{background:var(--ink);color:#fff}
.tab-btn.is-pending{opacity:.55}
.tab-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tab-label{font-size:14px;font-weight:700}
.tab-date{font-size:11.5px;opacity:.85}

.section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-bottom:18px;box-shadow:0 1px 2px rgba(1,28,64,.05)}
.section h2{margin:0 0 16px;font-size:19px;font-weight:700}
.section h3{margin:22px 0 12px;font-size:15px;font-weight:700;color:var(--muted)}
.h2-sub{font-weight:500;color:var(--muted);font-size:14px}
.lede{color:var(--muted);font-size:14px;margin:-6px 0 14px}
.note{color:var(--muted);font-size:13px;margin:12px 0 0}
.note.right{text-align:right}
.banner{padding:11px 16px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.info{background:var(--accent-bg);color:var(--ink);border-left:3px solid var(--accent)}

.kpi-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi-label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-height:2.6em}
.kpi-value{font-size:25px;font-weight:800;margin:4px 0 2px;white-space:nowrap}
.kpi-meta{font-size:12px;color:var(--muted)}
.flag{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;color:#b45309;text-transform:none;letter-spacing:0}

.qual-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 36px}
.qual-block h4{margin:4px 0 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dist-row{display:grid;grid-template-columns:minmax(150px,1.6fr) minmax(80px,2fr) 62px 40px;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.dist-bar-wrap{background:var(--line);border-radius:999px;height:12px;overflow:hidden}
.dist-bar{background:var(--accent);height:100%;border-radius:999px}
.dist-pct{text-align:right;font-weight:700}
.dist-n{text-align:right;color:var(--muted);font-size:12px}

.chat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chat-card{padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);min-width:0;overflow-wrap:anywhere}
.chat-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.chat-card-title{font-size:14.5px;font-weight:700}
.chat-card-count{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:999px;white-space:nowrap}
.chat-card-desc{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.chat-card-samples{list-style:none;margin:0;padding:0}
.chat-card-samples li{font-size:12.5px;color:var(--muted);font-style:italic;padding:5px 0;border-top:1px solid var(--line)}
.chat-reco{background:var(--accent-bg);border-left:3px solid var(--accent);padding:8px 12px;margin-top:10px;font-size:12.5px;border-radius:4px}

.pending{text-align:center;padding:56px 20px;color:var(--muted)}
.pending-ico{font-size:44px;margin-bottom:10px}
.pending-title{font-size:16px;font-weight:700;color:var(--ink)}
.pending-desc{font-size:13.5px;margin-top:6px}

@media (max-width:760px){
  .wrap{padding:16px 16px 48px}
  h1{font-size:24px}
  .section{padding:16px}
  .kpi-row{grid-auto-flow:row;grid-template-columns:1fr 1fr}
  .qual-grid,.chat-grid{grid-template-columns:1fr}
  .dist-row{grid-template-columns:1fr 60px 36px}
  .dist-bar-wrap{grid-column:1/-1;grid-row:2}
}
@media print{.tabs-nav{display:none}.tab-panel[hidden]{display:block !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="brand"><img src="https://decouvrir.cryptos-exponentielles.com/logo-cryptos-exponentielles.png" alt="Cryptos Exponentielles" onerror="this.outerHTML='<span class=logo-txt>Cryptos Exponentielles</span>'"><span>Analyse des lives</span></p>
      <h1>Sommet Exponentiel de la Crypto</h1>
      <div class="period">Challenge Saturnin Devins · 3 soirées en direct · du 22 au 24 novembre 2026</div>
    </div>
  </header>

  <nav class="tabs-nav" role="tablist" aria-label="Jours du challenge">{{TABS}}</nav>

{{PANELS}}
</div>
<script>
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-selected',on)});
  document.querySelectorAll('.tab-panel').forEach(p=>p.hidden=p.id!=='panel-'+b.dataset.tab);
}));
</script>
<script src="/nav.js"></script>
</body>
</html>
